[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frozen-hero"
version = "0.1.0"
description = "Freezer Inventory Management System"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Leonhard Hesse", email = "service@hero-devs.de" }]
keywords = ["freezer", "inventory", "qr-code", "raspberry-pi", "flask"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
dependencies = [
    # picamera2 is NOT listed here — it is a system package installed via apt
    # and made available through --system-site-packages in the venv.
    "flask>=3.0",
    "waitress>=3.0",
    "lgpio",
    "pyzbar",
    "brother-ql",
    "pillow",
]

[project.urls]
Repository = "https://github.com/hesseleo/frozen-hero"
"Bug Tracker" = "https://github.com/hesseleo/frozen-hero/issues"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
frozen-hero = "frozen_hero.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "PTH",      # flake8-use-pathlib
    "S",        # flake8-bandit (security)
    "LOG",      # flake8-logging
    "G",        # flake8-logging-format
]
ignore = [
    "S603",  # subprocess without shell=True — we explicitly use lists, this is safe
    "S607",  # partial path for executables — expected for system tools like `convert`
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is idiomatic in pytest

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "lgpio",
    "picamera2.*",
    "pyzbar.*",
    "brother_ql.*",
]
ignore_missing_imports = true

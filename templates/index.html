<!DOCTYPE html>
<html lang="de">
<head>
   <meta charset="utf-8"/>
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
   <title>frozen-hero</title>
   <link rel="icon" type="image/png" href="/favicon.png"/>
   <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
   <style>
      :root {
         --bg:           #095153;
         --surface:      #033335;
         --surface-dark: #02191a;
         --teal-light:   #73aaac;
         --gray:         #a5a3a3;
         --text:         #f0f8ff;
         --expired:      #570000;
         --radius:       14px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

      body {
         font-family: -apple-system, 'Trebuchet MS', sans-serif;
         background: var(--bg);
         color: var(--text);
         height: 100dvh;
         display: flex;
         flex-direction: column;
         overflow: hidden;
      }

      /* ── Header ─────────────────────────────────── */
      .app-header {
         display: flex;
         align-items: center;
         gap: 10px;
         padding: 10px 16px;
         background: var(--surface-dark);
         flex-shrink: 0;
      }

      .header-logo {
         height: 38px;
         width: auto;
         background: white;
         border-radius: 6px;
         padding: 2px 6px;
         flex-shrink: 0;
      }

      .header-title {
         flex: 1;
         font-size: 1.2em;
         font-weight: 600;
         color: var(--text);
      }

      #lang-select {
         font-family: inherit;
         font-size: 11pt;
         border-radius: 8px;
         padding: 4px 8px;
         border: none;
         background: var(--surface);
         color: var(--gray);
         cursor: pointer;
         flex-shrink: 0;
      }

      /* ── Main scrollable area ───────────────────── */
      main {
         flex: 1;
         overflow-y: auto;
         padding: 16px 16px 80px;
      }

      .view { display: none; }
      .view.active { display: block; }

      /* ── Cards ──────────────────────────────────── */
      .card {
         background: var(--surface);
         border-radius: var(--radius);
         padding: 16px;
         margin-bottom: 12px;
      }

      /* ── Form fields ────────────────────────────── */
      .field { margin-bottom: 14px; }
      .field:last-child { margin-bottom: 0; }

      .field label {
         display: block;
         font-size: 10pt;
         color: var(--teal-light);
         margin-bottom: 5px;
         letter-spacing: 0.03em;
      }

      .field input,
      .field select {
         width: 100%;
         font-family: inherit;
         font-size: 14pt;
         background: var(--surface-dark);
         color: var(--text);
         border: none;
         border-radius: 10px;
         padding: 10px 14px;
         outline: none;
         -webkit-appearance: none;
         color-scheme: dark;
      }

      .field input:focus,
      .field select:focus {
         box-shadow: 0 0 0 2px var(--teal-light);
      }

      .field-row {
         display: flex;
         gap: 12px;
      }

      .field-row .field { flex: 1; }

      /* ── Print button ───────────────────────────── */
      .btn-print {
         width: 100%;
         font-family: inherit;
         font-size: 15pt;
         font-weight: 700;
         background: var(--teal-light);
         color: var(--surface-dark);
         border: none;
         border-radius: 40px;
         padding: 14px;
         cursor: pointer;
         transition: opacity 0.15s;
         letter-spacing: 0.06em;
      }

      .btn-print:active { opacity: 0.75; }

      /* ── List items ─────────────────────────────── */
      .list-item {
         background: var(--surface);
         border-radius: var(--radius);
         padding: 14px 16px;
         margin-bottom: 10px;
         display: flex;
         align-items: center;
         gap: 12px;
         user-select: none;
      }

      .list-item.expired { background: var(--expired); }

      .item-info {
         flex: 1;
         min-width: 0;
      }

      .item-name {
         font-size: 13pt;
         font-weight: 600;
         white-space: nowrap;
         overflow: hidden;
         text-overflow: ellipsis;
      }

      .item-sub {
         font-size: 10pt;
         color: var(--gray);
         margin-top: 2px;
         white-space: nowrap;
         overflow: hidden;
         text-overflow: ellipsis;
      }

      .item-date {
         font-size: 11pt;
         color: var(--teal-light);
         flex-shrink: 0;
         text-align: right;
      }

      .list-item.expired .item-date { color: #ffaaaa; }

      .list-empty {
         text-align: center;
         color: var(--gray);
         padding: 48px 0;
         font-size: 12pt;
      }

      /* ── Bottom nav ─────────────────────────────── */
      .bottom-nav {
         display: flex;
         background: var(--surface-dark);
         flex-shrink: 0;
         padding-bottom: env(safe-area-inset-bottom);
      }

      .nav-btn {
         flex: 1;
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
         padding: 10px 0 12px;
         border: none;
         border-top: 2px solid transparent;
         background: none;
         color: var(--gray);
         font-family: inherit;
         font-size: 9pt;
         cursor: pointer;
         gap: 4px;
         transition: color 0.2s, border-color 0.2s;
      }

      .nav-btn.active {
         color: var(--teal-light);
         border-top-color: var(--teal-light);
      }

      .nav-btn svg { width: 22px; height: 22px; }

      /* ── Toast ──────────────────────────────────── */
      .toast {
         display: none;
         position: fixed;
         bottom: 90px;
         left: 50%;
         transform: translateX(-50%);
         background: var(--surface-dark);
         color: var(--text);
         padding: 11px 24px;
         border-radius: 40px;
         font-size: 12pt;
         border: 1px solid var(--teal-light);
         z-index: 10;
         white-space: nowrap;
      }

      .toast.show { display: block; }
   </style>
</head>

<body>

   <!-- Header -->
   <header class="app-header">
      <img src="/frozen-hero-logo.png" alt="Frozen HeRo" class="header-logo">
      <span class="header-title">Frozen HeRo</span>
      <select id="lang-select" onchange="setLanguage(this.value)">
         <option value="de">DE</option>
         <option value="en">EN</option>
      </select>
   </header>

   <!-- Content -->
   <main>

      <!-- New label view -->
      <div id="view-new" class="view active">
         <div class="card">
            <div class="field">
               <label data-i18n="label_row1">Erste Zeile</label>
               <input type="text" id="dec1" maxlength="20" autocomplete="off">
            </div>
            <div class="field">
               <label data-i18n="label_row2">Zweite Zeile</label>
               <input type="text" id="dec2" maxlength="64" autocomplete="off">
            </div>
         </div>

         <div class="card">
            <div class="field">
               <label data-i18n="label_category">Kategorie</label>
               <select id="my-select">
                  <option value="" disabled selected></option>
                  <option value="selfstuff" data-i18n="cat_selfstuff">Selbstgekochtes</option>
                  <option value="vegetable" data-i18n="cat_vegetable">Gemüse</option>
                  <option value="herbs"     data-i18n="cat_herbs">Kräuter</option>
                  <option value="meat"      data-i18n="cat_meat">Fleisch</option>
                  <option value="sausage"   data-i18n="cat_sausage">Wurst</option>
                  <option value="pastries"  data-i18n="cat_pastries">Backwaren</option>
                  <option value="diary"     data-i18n="cat_diary">Milchprodukte</option>
                  <option value="fruits"    data-i18n="cat_fruits">Obst</option>
                  <option value="butter"    data-i18n="cat_butter">Butter</option>
                  <option value="cake"      data-i18n="cat_cake">Kuchen</option>
                  <option value="fish"      data-i18n="cat_fish">Fisch</option>
               </select>
            </div>
            <div class="field-row">
               <div class="field">
                  <label data-i18n="label_amount">Menge</label>
                  <select id="select_amount">
                     <option value="one">1</option>
                     <option value="two">2</option>
                     <option value="three">3</option>
                     <option value="four">4</option>
                     <option value="five">5</option>
                  </select>
               </div>
               <div class="field">
                  <label data-i18n="label_date">Haltbar bis</label>
                  <input type="date" id="date">
               </div>
            </div>
         </div>

         <button class="btn-print" onclick="printButtonClick()" data-i18n="btn_print">DRUCKEN</button>
      </div>

      <!-- List view -->
      <div id="view-list" class="view">
         <div id="list-container"></div>
      </div>

   </main>

   <!-- Toast -->
   <div id="toast" class="toast"></div>

   <!-- Bottom nav -->
   <nav class="bottom-nav">
      <button class="nav-btn active" id="nav-new" onclick="showView('new')">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
         </svg>
         <span data-i18n="tab_new_label">Neues Label</span>
      </button>
      <button class="nav-btn" id="nav-list" onclick="showView('list')">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
            <circle cx="3" cy="6" r="1" fill="currentColor"/><circle cx="3" cy="12" r="1" fill="currentColor"/><circle cx="3" cy="18" r="1" fill="currentColor"/>
         </svg>
         <span data-i18n="tab_show_list">Liste</span>
      </button>
   </nav>

   <script>
      // ── i18n ───────────────────────────────────────────────────────────
      const TRANSLATIONS = {
         de: {
            tab_new_label:  "Neues Label",
            tab_show_list:  "Liste",
            label_row1:     "Erste Zeile",
            label_row2:     "Zweite Zeile",
            label_category: "Kategorie",
            label_amount:   "Menge",
            label_date:     "Haltbar bis",
            btn_print:      "DRUCKEN",
            modal_printing: "Wird gedruckt… :)",
            cat_selfstuff:  "Selbstgekochtes",
            cat_vegetable:  "Gemüse",
            cat_herbs:      "Kräuter",
            cat_meat:       "Fleisch",
            cat_sausage:    "Wurst",
            cat_pastries:   "Backwaren",
            cat_diary:      "Milchprodukte",
            cat_fruits:     "Obst",
            cat_butter:     "Butter",
            cat_cake:       "Kuchen",
            cat_fish:       "Fisch",
            delete_confirm: "Soll {name} gelöscht werden?",
            list_empty:     "Keine Einträge",
         },
         en: {
            tab_new_label:  "New Label",
            tab_show_list:  "List",
            label_row1:     "First line",
            label_row2:     "Second line",
            label_category: "Category",
            label_amount:   "Quantity",
            label_date:     "Best before",
            btn_print:      "PRINT",
            modal_printing: "Printing… :)",
            cat_selfstuff:  "Home-cooked",
            cat_vegetable:  "Vegetables",
            cat_herbs:      "Herbs",
            cat_meat:       "Meat",
            cat_sausage:    "Sausage",
            cat_pastries:   "Bakery",
            cat_diary:      "Dairy",
            cat_fruits:     "Fruit",
            cat_butter:     "Butter",
            cat_cake:       "Cake",
            cat_fish:       "Fish",
            delete_confirm: "Delete {name}?",
            list_empty:     "No entries",
         },
      };

      let currentLang = localStorage.getItem('lang') || 'de';

      function t(key, vars = {}) {
         let str = (TRANSLATIONS[currentLang] || TRANSLATIONS.de)[key] || key;
         for (const [k, v] of Object.entries(vars)) str = str.replaceAll(`{${k}}`, v);
         return str;
      }

      function setLanguage(lang) {
         currentLang = lang;
         localStorage.setItem('lang', lang);
         document.querySelectorAll('[data-i18n]').forEach(el => {
            el.textContent = t(el.dataset.i18n);
         });
         document.getElementById('lang-select').value = lang;
      }

      // ── View switching ─────────────────────────────────────────────────
      function showView(name) {
         document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
         document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
         document.getElementById('view-' + name).classList.add('active');
         document.getElementById('nav-' + name).classList.add('active');
         if (name === 'list') updateList();
      }

      // ── Swipe library (minified) ───────────────────────────────────────
      !function(t,e){"use strict";"function"!=typeof t.CustomEvent&&(t.CustomEvent=function(t,n){n=n||{bubbles:!1,cancelable:!1,detail:void 0};var a=e.createEvent("CustomEvent");return a.initCustomEvent(t,n.bubbles,n.cancelable,n.detail),a},t.CustomEvent.prototype=t.Event.prototype),e.addEventListener("touchstart",function(t){if("true"===t.target.getAttribute("data-swipe-ignore"))return;s=t.target,r=Date.now(),n=t.touches[0].clientX,a=t.touches[0].clientY,u=0,i=0},!1),e.addEventListener("touchmove",function(t){if(!n||!a)return;var e=t.touches[0].clientX,r=t.touches[0].clientY;u=n-e,i=a-r},!1),e.addEventListener("touchend",function(t){if(s!==t.target)return;var e=parseInt(l(s,"data-swipe-threshold","20"),10),o=parseInt(l(s,"data-swipe-timeout","500"),10),c=Date.now()-r,d="",p=t.changedTouches||t.touches||[];Math.abs(u)>Math.abs(i)?Math.abs(u)>e&&c<o&&(d=u>0?"swiped-left":"swiped-right"):Math.abs(i)>e&&c<o&&(d=i>0?"swiped-up":"swiped-down");if(""!==d){var b={dir:d.replace(/swiped-/,""),touchType:(p[0]||{}).touchType||"direct",xStart:parseInt(n,10),xEnd:parseInt((p[0]||{}).clientX||-1,10),yStart:parseInt(a,10),yEnd:parseInt((p[0]||{}).clientY||-1,10)};s.dispatchEvent(new CustomEvent("swiped",{bubbles:!0,cancelable:!0,detail:b})),s.dispatchEvent(new CustomEvent(d,{bubbles:!0,cancelable:!0,detail:b}))}n=null,a=null,r=null},!1);var n=null,a=null,u=null,i=null,r=null,s=null;function l(t,n,a){for(;t&&t!==e.documentElement;){var u=t.getAttribute(n);if(u)return u;t=t.parentNode}return a}}(window,document);

      // ── Utilities ──────────────────────────────────────────────────────
      function getDateFormat(date = new Date()) {
         const d = String(date.getDate()).padStart(2, '0');
         const m = String(date.getMonth() + 1).padStart(2, '0');
         return `${date.getFullYear()}-${m}-${d}`;
      }

      function formatDisplayDate(iso) {
         const [y, m, d] = iso.split('-');
         return `${d}.${m}.${y}`;
      }

      // ── Data ───────────────────────────────────────────────────────────
      function fetchEntries(cb) {
         const xhr = new XMLHttpRequest();
         xhr.open('GET', '/getData');
         xhr.setRequestHeader('Content-Type', 'application/json');
         xhr.onreadystatechange = function() {
            if (this.readyState === 4) cb(JSON.parse(this.responseText));
         };
         xhr.send(null);
      }

      function updateList() { fetchEntries(renderList); }

      function renderList(list) {
         const container = document.getElementById('list-container');
         container.innerHTML = '';

         if (list.length === 0) {
            const el = document.createElement('div');
            el.className = 'list-empty';
            el.textContent = t('list_empty');
            container.appendChild(el);
            return;
         }

         const today = getDateFormat();
         list.forEach(entry => {
            const expired = entry.date < today;
            const item    = document.createElement('div');
            item.className = 'list-item' + (expired ? ' expired' : '');
            item.dataset.id   = entry.id;
            item.dataset.name = entry.row_one + (entry.row_two ? ' | ' + entry.row_two : '');

            const info = document.createElement('div');
            info.className = 'item-info';

            const nameEl = document.createElement('div');
            nameEl.className = 'item-name';
            nameEl.textContent = entry.row_one;
            info.appendChild(nameEl);

            if (entry.row_two) {
               const subEl = document.createElement('div');
               subEl.className = 'item-sub';
               subEl.textContent = entry.row_two;
               info.appendChild(subEl);
            }

            const dateEl = document.createElement('div');
            dateEl.className = 'item-date';
            dateEl.textContent = formatDisplayDate(entry.date);

            item.appendChild(info);
            item.appendChild(dateEl);

            item.addEventListener('swiped-left',  () => deleteEntry(item));
            item.addEventListener('swiped-right', () => deleteEntry(item));

            container.appendChild(item);
         });
      }

      function deleteEntry(item) {
         if (!confirm(t('delete_confirm', { name: item.dataset.name }))) return;
         const xhr = new XMLHttpRequest();
         xhr.open('POST', '/delEntry');
         xhr.setRequestHeader('Content-Type', 'application/json');
         xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) updateList();
         };
         xhr.send(JSON.stringify({ id: parseInt(item.dataset.id) }));
      }

      // ── Category → shelf life ──────────────────────────────────────────
      const KEEPABILITY = {
         selfstuff: 2, vegetable: 9, herbs: 8, meat: 5, sausage: 2,
         pastries: 2, diary: 3, fruits: 10, butter: 7, cake: 4, fish: 2,
      };
      let choosenCategory = '';

      document.getElementById('my-select').addEventListener('change', function() {
         choosenCategory = this.value;
         const d = new Date(getDateFormat());
         d.setMonth(d.getMonth() + (KEEPABILITY[this.value] || 0));
         document.getElementById('date').value = getDateFormat(d);
      });

      // ── Print ──────────────────────────────────────────────────────────
      function showToast(msg) {
         const el = document.getElementById('toast');
         el.textContent = msg;
         el.classList.add('show');
      }

      function hideToast() {
         document.getElementById('toast').classList.remove('show');
      }

      function printButtonClick() {
         const row1   = document.getElementById('dec1').value.trim();
         const row2   = document.getElementById('dec2').value.trim();
         const date   = document.getElementById('date').value;
         const amount = document.getElementById('select_amount').selectedIndex + 1;

         if (!row1 || !date) return;

         const data = { row1, row2, category: choosenCategory, date };
         let sent = 0;

         showToast(t('modal_printing'));

         function sendOne() {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/add2freezer');
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function() {
               if (xhr.readyState !== 4 || xhr.status !== 201) return;
               sent++;
               if (sent < amount) { sendOne(); return; }
               hideToast();
               document.getElementById('dec1').value = '';
               document.getElementById('dec2').value = '';
               document.getElementById('date').value = getDateFormat();
               document.getElementById('my-select').value = '';
               document.getElementById('select_amount').selectedIndex = 0;
               choosenCategory = '';
            };
            xhr.send(JSON.stringify(data));
         }
         sendOne();
      }

      // ── Init ───────────────────────────────────────────────────────────
      document.getElementById('date').value = getDateFormat();
      setLanguage(currentLang);
      fetchEntries(renderList);
   </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8"/>
   <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
   <title>frozen-hero</title>
   <link rel="icon" type="image/png" href="/favicon.png" />
   <style>
      .container {
         max-width: 500px;
         margin: 25px auto;
         background-repeat: no-repeat;
         background-position: center 0px;
      }

      .content {
         font-size: 14pt;
         font-family: 'Trebuchet MS', sans-serif;
      }

      .tab {
         overflow: hidden;
      }

      /* Style the buttons that are used to open the tab content */
      .tab button {
         background-color: inherit;
         float:none;
         border: none;
         outline: none;
         cursor: pointer;
         padding: 9px 11px;
         transition: 0.3s;
         margin: 0px;
         font-family: 'Trebuchet MS', sans-serif;
         font-size: 13pt;
         border: rgb(3, 51, 53);
         border-width: 2.5px;
         border-style: solid;
         border-top: none;
         border-right: none;
         border-left: none;
         background-color: rgb(165, 163, 163);
         margin-left: 5px;
         margin-right: 5px;
         color:rgb(3, 51, 53)
      }

      /* Change background color of buttons on hover */
      .tab button:hover {
         background-color: rgb(115, 170, 172);
      }

      /* Create an active/current tablink class */
      .tab button.active {
         background-color:rgb(3, 51, 53);
         color:aliceblue;
         border: aliceblue;
         border-width: 2.5px;
         border-style: solid;
         border-top: none;
         border-left: none;
         border-right: none;
      }

      /* Style the tab content */
      .tabcontent {
         border-top: none;
         text-align: center;
      }
      .center {
         margin-left: auto;
         margin-right: auto;
      }

      .column {
         background-color: rgb(2, 25, 26);
         font-size: 15pt;
         padding: 0.7em 0.5em 0.7em 0.5em;
         text-align: left;
         color:aliceblue;
         font-family: 'Trebuchet MS', sans-serif;
      }

      .cell {
         padding: 0.7em 0.5em 0.7em 0.5em;
         text-align: left;
         color:aliceblue;
         font-family: 'Trebuchet MS', sans-serif;
      }

      .cell_name {
         padding: 0.7em 0.5em 0.7em 0.5em;
         text-align: left;
         color:aliceblue;
         font-family: 'Trebuchet MS', sans-serif;
         word-break:break-all;
      }

      .printButton {
         font-size:17pt;
         background-color: aliceblue;
         font-weight:900;
         border-radius: 40px;
         margin-top:5px;
         padding: 9px 17px 9px 17px;
         cursor: pointer;
         color:rgb(3, 51, 53);
      }

      .inputField {
         border-radius:14px;
         margin:5px;
         font-size:15pt;
         width:240px
      }

      .modal {
         display: none; /* Hidden by default */
         position: fixed; /* Stay in place */
         z-index: 1; /* Sit on top */
         left: 0;
         top: 0;
         width: 100%; /* Full width */
         height: 100%; /* Full height */
         overflow: auto; /* Enable scroll if needed */
         background-color: rgb(0,0,0); /* Fallback color */
         background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
      }

      /* Modal Content/Box */
      .modal-content {
         background-color: #fefefe;
         margin: 15% auto; /* 15% from the top and centered */
         padding: 20px;
         border: 1px solid #888;
         max-width: 250px;
      }

      #my-select{
         margin-top: 7px;
      }

      #select_amount{
         margin-top: 7px;
      }

      tr:nth-child(even){
         background-color: rgb(3, 51, 53)
      }

      .cellred {
         padding: 0.7em 0.5em 0.7em 0.5em;
         text-align: left;
         color:aliceblue;
         font-family: 'Trebuchet MS', sans-serif;
         background-color: #570000;
      }
   </style>
</head>

<body class="container" style="text-align:center; background-color:rgb(9, 81, 83);">
   <div class="content">
      <h1 style="color: aliceblue; margin-bottom: 30px;">frozen-hero</h1>

      <div class="tab" style="display:inline-block; text-align: center; margin-bottom: 20pt;">
         <button class="tablinks" id="startButton" onclick="openTab(event, 'newLabel')">Neues Label</button>
         <button class="tablinks" id="showListButton" onclick="openTab(event, 'showList')">Liste anzeigen</button>
      </div>
      <div id="newLabel" class="tabcontent">
         <label style="color: aliceblue;" for="dec1">Erste Zeile:</label><br>
         <input type="text" id="dec1" name="dec1" class="inputField" maxlength="20"><br><br>
         <label style="color: aliceblue;" for="dec2">Zweite Zeile:</label><br>
         <input type="text" id="dec2" name="dec2" class="inputField" maxlength="64"><br><br>

         <div id="wrapper">
            <div id=category style="display: inline-block; width: 200px">
               <label style="color: aliceblue;" for="category">Kategorie:</label>
               <select name="category" style="border-radius:14px; font-size:15pt; padding-left:6px; padding-right:6px" id="my-select">
                  <option value="selfstuff">Selbstgekochtes</option>
                  <option value="vegetable">Gemüse</option>
                  <option value="herbs">Kräuter</option>
                  <option value="meat">Fleisch</option>
                  <option value="sausage">Wurst</option>
                  <option value="pastries">Backwaren</option>
                  <option value="diary">Milchprodukte</option>
                  <option value="fruits">Obst</option>
                  <option value="butter">Butter</option>
                  <option value="cake">Kuchen</option>
                  <option value="fish">Fisch</option>
               </select>
            </div>
            <div id="amount" style="display: inline-block; width: 80px">
               <label style="color: aliceblue;" for="amount">Menge:</label>
               <select name="amount" style="border-radius:14px; font-size:15pt; padding-left:6px; padding-right:6px" id="select_amount">
                  <option value="one">1</option>
                  <option value="two">2</option>
                  <option value="three">3</option>
                  <option value="four">4</option>
                  <option value="five">5</option>
               </select>
            </div>
         </div>
         <br>
         <label style="color: aliceblue;" for="date">Haltbar bis:</label><br>
         <input type="date" style="font-size:15pt; border-radius:14px; padding-left:6px; padding-right:6px; margin:8px; color:rgb(3, 51, 53); width: 170px;" id="date"><br><br>

         <button class="printButton" id="printButton" onclick="printButtonClick()">DRUCKEN</button>

         <div id="myModal" class="modal">
            <!-- Modal content -->
            <div class="modal-content">
               <p>Wird gedruckt... :)
               </p>
            </div>
         </div>

      </div>


      <div id="showList" class="tabcontent">

         <table id="myTable" class="center" style="table-layout: fixed">
            <thead>
               <tr>
                 <th class="column" id="firstColumn">ID</th>
                  <th class="column" id="secondColumn">Lebensmittel</th>
                  <th class="column" id="thirdColumn">Datum</th>
               </tr>
            </thead>
            <tbody id="tbody">
            </tbody>
         </table>
      </div>

      <script>

         !function(t,e){"use strict";"function"!=typeof t.CustomEvent&&(t.CustomEvent=function(t,n){n=n||{bubbles:!1,cancelable:!1,detail:void 0};var a=e.createEvent("CustomEvent");return a.initCustomEvent(t,n.bubbles,n.cancelable,n.detail),a},t.CustomEvent.prototype=t.Event.prototype),e.addEventListener("touchstart",function(t){if("true"===t.target.getAttribute("data-swipe-ignore"))return;s=t.target,r=Date.now(),n=t.touches[0].clientX,a=t.touches[0].clientY,u=0,i=0},!1),e.addEventListener("touchmove",function(t){if(!n||!a)return;var e=t.touches[0].clientX,r=t.touches[0].clientY;u=n-e,i=a-r},!1),e.addEventListener("touchend",function(t){if(s!==t.target)return;var e=parseInt(l(s,"data-swipe-threshold","20"),10),o=parseInt(l(s,"data-swipe-timeout","500"),10),c=Date.now()-r,d="",p=t.changedTouches||t.touches||[];Math.abs(u)>Math.abs(i)?Math.abs(u)>e&&c<o&&(d=u>0?"swiped-left":"swiped-right"):Math.abs(i)>e&&c<o&&(d=i>0?"swiped-up":"swiped-down");if(""!==d){var b={dir:d.replace(/swiped-/,""),touchType:(p[0]||{}).touchType||"direct",xStart:parseInt(n,10),xEnd:parseInt((p[0]||{}).clientX||-1,10),yStart:parseInt(a,10),yEnd:parseInt((p[0]||{}).clientY||-1,10)};s.dispatchEvent(new CustomEvent("swiped",{bubbles:!0,cancelable:!0,detail:b})),s.dispatchEvent(new CustomEvent(d,{bubbles:!0,cancelable:!0,detail:b}))}n=null,a=null,r=null},!1);var n=null,a=null,u=null,i=null,r=null,s=null;function l(t,n,a){for(;t&&t!==e.documentElement;){var u=t.getAttribute(n);if(u)return u;t=t.parentNode}return a}}(window,document);

         function getDateFormat (date = new Date()){
            var day = ("0" + date.getDate()).slice(-2);
            var month = ("0" + (date.getMonth() + 1)).slice(-2);
            var today = date.getFullYear()+"-"+(month)+"-"+(day);
            return today;
         }

         getDatafromDatabase()
         function getDatafromDatabase(){
            let xhr_get = new XMLHttpRequest();
            xhr_get.withCredentials = true;
            xhr_get.open("GET", "/getData");
            xhr_get.setRequestHeader("Content-Type", "application/json");
            xhr_get.send( null );

            xhr_get.addEventListener("readystatechange", function() {
               if(this.readyState === 4) {
                  var list = JSON.parse(this.responseText)
                  showList(list)
               }
            })
         }

         function updateList(){
            var parent = document.getElementById('tbody');
            while(parent.hasChildNodes())
            {
               parent.removeChild(parent.firstChild);
            }
            getDatafromDatabase()
         }

         /*showList( list = [{"id": 15,
         "row_one": "Lasagne",
         "row_two": "vegie",
         "category": "selfstuff",
         "date": "2022-02-17"}, {"id": 16,
         "row_one": "test",
         "row_two": "vegie",
         "category": "selfstuff",
         "date": "2022-05-17"}])  */

         function showList(list){
            for(i=0; i<list.length; i++){
               //add row
               var table_row = document.createElement("TR");
               table_row.setAttribute("id", "myTr");
               document.querySelector("tbody").appendChild(table_row);
               var entry = list[i];
               // Add IDs
               var id = entry['id']
               var table_data_cell = document.createElement("TD")
               var table_cell_node = document.createTextNode(id)
               table_data_cell.className = "cell"
               table_data_cell.appendChild(table_cell_node)
               table_row.appendChild(table_data_cell);
               //Add name
               var firstRow = entry['row_one']
               var secondRow = entry['row_two']
               var table_data_cell = document.createElement("TD")
               if(secondRow.length != 0) {
                  var table_cell_node = document.createTextNode(firstRow + ' | ' + secondRow)
               }
               else {
                  var table_cell_node = document.createTextNode(firstRow)
               }

               table_data_cell.className = "cell_name"
               table_data_cell.appendChild(table_cell_node);
               table_row.appendChild(table_data_cell);
               //add date
               var date = entry['date']
               let datetime = new Date(date)
               let formatted_date = (("0" + datetime.getDate()).slice(-2)) + "." + (("0" + (datetime.getMonth() + 1)).slice(-2)) + "." + datetime.getFullYear()
               var table_data_cell = document.createElement("TD")
               var table_cell_node = document.createTextNode(formatted_date)
               table_data_cell.className = date < getDateFormat() ? "cellred" : "cell";
               table_data_cell.appendChild(table_cell_node);
               table_row.appendChild(table_data_cell);

               //add Swipe-Listener
               table_row.addEventListener('swiped-left', function(e) {
                  deleteEntry(e.target.parentNode); // element that was swiped
               });
               table_row.addEventListener('swiped-right', function(e) {
                  deleteEntry(e.target.parentNode); // element that was swiped
               });
            }
         }



         function deleteEntry(evt){
            //Dialog confirm
            let text = "Soll " + evt.cells[1].innerHTML +  " gelöscht werden?";
            if (confirm(text) == false) {
               return;
            }

            //Delete from Database
            let xhr_delete = new XMLHttpRequest();
            let url = "/delEntry";
            xhr_delete.open("POST", url);
            xhr_delete.setRequestHeader("Content-Type", "application/json");

            //Update table
            xhr_delete.onreadystatechange = function () {
               if (xhr_delete.readyState == 4 && xhr_delete.status === 200) {
                  updateList()
               }
            }
            var json = {"id": evt.cells[0].innerHTML}
            xhr_delete.send(JSON.stringify(json))
         }
      </script>

      <script>
         let xhr_post = new XMLHttpRequest();
         let url = "/add2freezer";


         //Set date picker to current date + initial start page
         document.getElementById('date').value = getDateFormat()
         tabcontent = document.getElementsByClassName("tabcontent");
         for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
         }
         document.getElementById('startButton').className += " active";
         document.getElementById('newLabel').style.display = "block";

         //Set category listener
         var categories = [["selfstuff", 2], ["vegetable", 9], ["herbs", 8], ["meat", 5], ["sausage", 2], ["pastries", 2], ["diary", 3], ["fruits", 10], ["butter", 7], ["cake", 4], ["fish", 2]];
         var choosenCategory = ""
         var keepability = 0
         var newDateInDateFormat;
         document.getElementById("my-select").selectedIndex = -1;
         document.getElementById('my-select').addEventListener('change', function() {
            for (i=0; i<categories.length; i++){
               if(this.value == categories[i][0]){
                  keepability = categories[i][1];
                  choosenCategory = categories[i][0]
               }

               //Update date
               var newDate  = new Date(getDateFormat())
               newDate.setMonth(newDate.getMonth() + keepability);
               newDateInDateFormat = getDateFormat(newDate)
               document.getElementById('date').value = newDateInDateFormat
            }
         });

         //set button click listener
         function printButtonClick() {
            var modal = document.getElementById("myModal")
            input1 = document.getElementById('dec1');
            input2 = document.getElementById('dec2');
            var amount = document.getElementById('select_amount').selectedIndex + 1
            var counter = 1
            if(input1.value.length!=0 || input2.value.length!=0)
            {
               data = {"row1": input1.value, "row2":input2.value, "category": choosenCategory, "date": document.getElementById('date').value}
               openDatabase()
               xhr_post.onreadystatechange = function () {
                  if (xhr_post.status == 201) {
                     if (amount > counter){
                        console.log("Amount " + amount)
                        console.log("COunter " + counter)
                        counter += 1;
                        openDatabase()
                        sendData(data)
                     }
                  }
                  if (xhr_post.readyState == 4 && xhr_post.status == 201) {
                     console.log("ReadyUpdateList")
                     //update list
                     updateList()
                     modal.style.display = "none";
                  }
               };
               sendData(data)

               //show Feedback
               modal.style.display = "block"

               //reset screen
               input1.value = ""
               input2.value = ""
               document.getElementById('date').value = getDateFormat()
               document.getElementById("my-select").selectedIndex = -1;
               document.getElementById("select_amount").selectedIndex = 0;
               counter = 1;
            }

         }

         function openDatabase(){
            // open a connection
            xhr_post.open("POST", url);

            // Set the request header i.e. which type of content you are sending
            xhr_post.setRequestHeader("Content-Type", "application/json");
         }

         function sendData(data){
            console.log("SENDDATA")
            var dataStr = JSON.stringify(data);
            xhr_post.send(dataStr)
         }

         function openTab(evt, optionSelected) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
               tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
               tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(optionSelected).style.display = "block";
            evt.currentTarget.className += " active";
         }
      </script>

   </div>
</body>
</html>
